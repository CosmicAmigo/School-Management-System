<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BehaviTracker | Statistics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="stats">
  <header class="topbar">
    <h1>BehaviTracker</h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="students.html">Students</a>
      <a href="rules.html">Rules</a>
      <a class="active" href="stats.html">Statistics</a>
      <a class="settings-link" href="admin.html" aria-label="Settings">⚙️</a>
    </nav>
  </header>

  <main class="container charts">
    <section class="card"><h2>Score Distribution by Class</h2><canvas id="classChart"></canvas></section>
    <section class="card"><h2>Merits vs Demerits</h2><canvas id="meritChart"></canvas></section>
    <section class="card"><h2>Top Students</h2><canvas id="topChart"></canvas></section>

    <section class="card">
      <h2>Top Teams (Average Score)</h2>
      <ol id="team-ranking"></ol>
    </section>

    <section class="card">
      <h2>Class Rankings (Average Score)</h2>
      <ol id="class-ranking"></ol>
    </section>

    <section class="card">
      <h2>Majority Status by Class</h2>
      <ul id="class-majority"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="main.js"></script>
</body>
</html>
