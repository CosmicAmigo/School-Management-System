<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BehaviTracker | Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="dashboard">
  <header class="topbar">
    <h1>BehaviTracker</h1>
    <nav>
      <a class="active" href="index.html">Dashboard</a>
      <a href="students.html">Students</a>
      <a href="rules.html">Rules</a>
      <a href="stats.html">Statistics</a>
      <a href="admin.html">Admin</a>
    </nav>
    <button id="reset-data" class="danger" type="button">Reset Defaults</button>
  </header>

  <main class="container">
    <section class="card">
      <h2>Student Dashboard</h2>
      <div class="filters">
        <label>Class
          <select id="class-filter"></select>
        </label>
        <label>Status
          <select id="status-filter">
            <option value="all">All</option>
            <option value="Excellent">Excellent</option>
            <option value="Watch">Watch</option>
            <option value="At Risk">At Risk</option>
          </select>
        </label>
        <label>Team
          <select id="team-filter"></select>
        </label>
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Class / Stream</th>
            <th>Team</th>
            <th><button id="sort-score" class="link-btn" type="button">Current Score ↕</button></th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="student-table-body"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Award / Deduct Points</h2>
      <form id="points-form" class="grid-form">
        <label>Teacher
          <select id="teacher-select" required></select>
        </label>

        <label>Student
          <select id="student-select" required></select>
        </label>

        <label>Rule
          <select id="rule-select"></select>
        </label>

        <label>Type
          <select id="point-type">
            <option value="merit">Merit</option>
            <option value="demerit">Demerit</option>
          </select>
        </label>

        <label>Points
          <input id="point-value" type="number" min="1" value="5" required />
        </label>

        <label class="full-width">Description
          <input id="point-description" type="text" placeholder="What happened?" required />
        </label>

        <button type="submit">Submit</button>
      </form>
      <p class="note" id="award-mode-note"></p>
    </section>

    <section class="card">
      <h2>Teacher Quick Add Student</h2>
      <form id="teacher-add-student-form" class="grid-form">
        <label>Teacher
          <select id="teacher-add-teacher" required></select>
        </label>
        <label>Student Name
          <input id="teacher-add-name" type="text" required />
        </label>
        <label>Class
          <select id="teacher-add-class" required></select>
        </label>
        <label>Stream / Track
          <select id="teacher-add-stream" required></select>
        </label>
        <label>Team
          <select id="teacher-add-team" required></select>
        </label>
        <button type="submit">Add Student</button>
      </form>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
